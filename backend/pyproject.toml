[project]
name = "health-manager-v2"
version = "1.3.0"
description = "Self-hosted family health record manager — clean-room rebuild."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.0",
    "apscheduler>=3.11.3",
    "cryptography>=44.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "json-repair>=0.64.2",
    "passlib[argon2]>=1.7.4",
    "pillow>=13.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.8.0",
    "pymupdf>=2.0",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.12",
    "pywebpush>=2.5.0",
    "qrcode[pil]>=8.2",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pip-audit>=2.10.0",
    "pyinstaller>=6.22.3",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
# The legacy C tracer silently loses events under this Python 3.12 build's
# event loop; sys.monitoring tracks everything correctly.
core = "sysmon"

[tool.coverage.report]
# Ratchet: measured 89% (2026-11-02, post phase 10). Floor sits 1pt under.
# Raise as coverage grows; never lower.
fail_under = 88

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F821"]
per-file-ignores = { "app/models/*.py" = ["F821"] }

[tool.mypy]
python_version = "3.11"
warn_return_any = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
disallow_untyped_defs = false
